[package]
name = "ci-utils"
version = "0.1.2"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
tonic-prost-build = { version = "0.14.2" }
# Запінено замість "*". Зірочка на base64 резолвилась у 0.13, де немає трейта
# `Engine`, який використовує код нижче, — і збірка падала на
# `unresolved import base64::Engine` у кожного споживача. Дата резолюції
# вирішувала, зберетьcя сервіс чи ні.
reqwest = { version = "0.12", features = ["blocking"] }
serde_json = "1"
base64 = "0.22"
zip = { version = "6.0.0" }
