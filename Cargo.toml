[package]
name = "ci-utils"
version = "0.1.1"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
tonic-build = { version = "0.13.1", features = ["prost"] }
# Запінено навмисно. З `version = "*"` крейт ламався сам: у lockfile, де вже
# був base64 0.13, зірочка падала на нього, а код використовує трейт `Engine`
# з 0.21+. Той самий клас поломки, що зупинив accounts-ql через hmac.
reqwest = { version = "0.12", features = ["blocking"] }
serde_json = "1"
base64 = "0.22"
